apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasktrack
  labels:
    app: tasktrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tasktrack
  template:
    metadata:
      labels:
        app: tasktrack
    spec:
      containers:
        - name: tasktrack
          image: raashikasat04/tasktrack:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10